[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "extreme-observation-hedging"
version = "0.1.0"
description = "Data access and research code for extreme observations and hedge revisions"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pandas>=2.2.3,<3",
    "python-dotenv>=1.2,<2",
    "SQLAlchemy>=2.0.55,<3",
    "psycopg2-binary>=2.9.13,<3",
    "wrds>=3.5,<4",
    "lseg-data>=2.1.1,<3",
    "databento>=0.87,<1",
]

[project.optional-dependencies]
research = [
    "numpy>=2.2,<3",
    "pyarrow>=26,<27",
    "scipy>=1.18,<2",
    "statsmodels>=0.15,<1",
    "scikit-learn>=1.9,<2",
    "matplotlib>=3.11,<4",
]
report = [
    "ipykernel>=7.3,<8",
    "nbformat>=5.11,<6",
    "nbclient>=0.11,<1",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["finance_data*", "hedging*"]
